[package]
name = "mophila"
version = "0.1.0"
edition = "2024"
description = "A language for writing motion graphics videos as code"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
parley = { version = "0.11.1", features = ["complex-scripts"] }
pollster = "1.0.1"
serde = "1.0.229"
serde_json = "1.0.151"
vello = "0.10.0"
wgpu = "29"
winit = "0.30"

# 依存クレート (vello / wgpu / parley) だけ最適化する。自分のコードは debug のまま
[profile.dev.package."*"]
opt-level = 3
